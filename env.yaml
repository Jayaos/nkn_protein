name: kernel_protein_fitness

channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip>=23
  - setuptools>=68
  - ipykernel
  - numpy=1.26.4
  - matplotlib>=3.8,<3.11
  - pytorch=2.5.1
  - pytorch-cuda=12.1
  - pip:
      - "--find-links https://data.pyg.org/whl/torch-2.5.0+cu121.html"
      - transformers==4.48.1
      - huggingface-hub==0.29.3
      - "safetensors>=0.4.3,<1"
      - biopython==1.85
      - biotite==0.41.2
      - scipy==1.14.1
      - torch-geometric==2.6.1
      # ProSST quantizer: matching CUDA wheels and published codebook runtime.
      - joblib==1.3.2
      - scikit-learn==1.2.2
      - torch-scatter==2.1.2+pt25cu121
